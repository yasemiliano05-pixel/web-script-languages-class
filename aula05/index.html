<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>while</title>
    <script>
        //for
        console.log("FOR");
        
        for(i=0;i<=10; i++){
            console.log(i);
            
        }

        //contagem regressiva de 10 até 1
        for(i=0;i>=1; i--){
            console.log(i);
            
        }

        //While 
        console.log("\n");
        console.log("WHILE");
        i=1;

        //var i =1; //hoisting
            while(i <= 10){
                console.log(i);
                i++;
                
            }
        
    </script>
</head>
<body>
    
</body>
</html>
